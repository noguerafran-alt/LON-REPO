<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BFYQGG43VR"></script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carta — LON Philosophy</title>
<meta name="description" content="Carta del café de LON Philosophy: café, bebidas, brunch y pastelería.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/icono-favicon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icono-favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6EFE4; --bg-card:#FFFBF5; --ink:#3B1220; --ink-muted:#6B3A45;
  --line:rgba(59,18,32,.14); --bg-header:#5E1E2B; --header-text:#FFF3E5;
}
*{box-sizing:border-box}
body{margin:0;font-family:Fraunces,Georgia,serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
/* Flecha de volver a la izquierda (pedido del dueño, misma que en /cliente)
   y el selector de idioma a la derecha, como en el resto del sitio. */
.barra{background:var(--bg-header);color:var(--header-text);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.barra .volver{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-8px;color:var(--header-text)}
.barra .volver svg{width:30px;height:30px;display:block;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.portada a{display:inline-block}
main{max-width:640px;margin:0 auto;padding:28px 16px 56px}
.portada{text-align:center;margin-bottom:28px}
.portada img{width:min(260px,70%);height:auto}
.portada p.aviso-foto{margin-top:10px;font-size:11px;letter-spacing:.2em;opacity:.8}
.portada p[hidden]{display:none}
.portada p{margin:6px 0 0;font-size:12px;font-variant-caps:all-small-caps;letter-spacing:.3em;color:var(--ink-muted)}
h2.seccion{font-weight:400;font-size:clamp(22px,6vw,28px);font-variant-caps:all-small-caps;letter-spacing:.24em;text-align:center;margin:40px 0 16px}
h3{font-weight:500;font-size:15px;font-variant-caps:all-small-caps;letter-spacing:.22em;text-align:center;margin:0 0 12px}
h4{font-weight:400;font-size:12px;font-variant-caps:all-small-caps;letter-spacing:.2em;color:var(--ink-muted);margin:14px 0 4px}
.caja{position:relative;isolation:isolate;border:1px solid var(--ink);border-radius:14px;padding:18px 16px;margin:0 0 16px}
/* La marca de agua va en ::before con z-index negativo dentro de un contexto aislado: queda detrás del texto sin tapar clics. */
/* El fondo va agrandado a proposito: el logo trae las letras L y N a los
   costados del gajo, y al 230% quedan fuera de la caja. Asi se ve solo el
   gajo, como la marca de agua de la carta impresa — con el logo entero se
   leia "L O N" compitiendo con los precios. */
/* Marca de agua con el gajo SOLO (gajo.png, recortado del logo): con el
   logo entero habia que agrandarlo tanto para sacarle las letras que el
   gajo se salia de las cajas chicas y quedaba cortado y descentrado.
   El alto relativo lo deja centrado y entero en cada caja, mida lo que
   mida, que es como esta en la carta impresa. */
.caja.marca::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:url('/gajo.png') center/auto 62% no-repeat;opacity:.05}
.nombre{font-variant-caps:all-small-caps;letter-spacing:.14em;font-size:15px;font-weight:400}
.precio{font-variant-numeric:lining-nums;text-align:right;white-space:nowrap;font-size:15px}
.desc{display:block;margin:2px 0 0;font-size:13.5px;line-height:1.45;color:var(--ink-muted);font-weight:300}
.opc{font-size:13px}
.fila{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,3.6rem);gap:0 4px;align-items:baseline;padding:6px 0}
.fila.uno{grid-template-columns:minmax(0,1fr) 4.5rem}
.fila.enc{border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:2px}
.fila.enc span{font-variant-caps:all-small-caps;letter-spacing:.14em;font-size:13px;color:var(--ink-muted);text-align:right}
.fila.enc span:first-child{text-align:left}
.fila .precio{text-align:center}
.fila.uno .precio{text-align:right}
.item{padding:7px 0}
.item .linea{display:flex;align-items:baseline;gap:8px}
.item .linea .nombre{flex:0 1 auto}
.item .linea .precio{margin-left:auto}
ul.puntos{list-style:none;margin:0;padding:0}
ul.puntos li{display:flex;align-items:baseline;gap:6px;padding:6px 0}
ul.puntos li i{flex:1;min-width:12px;border-bottom:2px dotted var(--ink-muted);opacity:.5;transform:translateY(-3px)}
.sintacc{display:inline-block;vertical-align:-2px;margin-left:6px}
footer{text-align:center;font-size:13px;color:var(--ink-muted);padding:0 16px 40px}
[data-foto].con-foto{cursor:pointer}
[data-foto].con-foto:focus-visible{outline:1px solid var(--ink);outline-offset:2px;border-radius:6px}
dialog.foto{border:1px solid var(--ink);border-radius:14px;background:var(--bg-card);color:var(--ink);padding:14px;margin:auto;max-width:90vw;max-height:90vh;overflow:hidden;position:fixed}
dialog.foto::backdrop{background:rgba(20,6,10,.72)}
dialog.foto img{display:block;max-width:calc(90vw - 30px);max-height:70vh;width:auto;height:auto;object-fit:contain;border-radius:8px;margin:0 auto}
dialog.foto .nombre{display:block;text-align:center;margin-top:10px}
dialog.foto button{position:absolute;top:6px;right:6px;width:32px;height:32px;border:0;border-radius:50%;background:var(--bg-card);color:var(--ink);font:inherit;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
body.foto-abierta{overflow:hidden}
#carta{min-height:60vh}
.cargando{text-align:center;margin:40px 0;font-size:13px;font-variant-caps:all-small-caps;letter-spacing:.3em;color:var(--ink-muted)}
@media (max-width:420px){
  .nombre{letter-spacing:.08em;font-size:14px}
  .fila{grid-template-columns:minmax(0,1fr) repeat(3,3rem);gap:0 2px}
  .caja{padding:16px 12px}
}
</style>
</head>
<body>
<div class="barra">
  <a class="volver" href="/" aria-label="Volver" title="Volver" data-i18n-attr="aria-label:t_volver,title:t_volver"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></a>
  <div data-selector-idioma></div>
</div>
<main>
  <!-- El logo es el camino de vuelta al inicio: es donde la gente toca
       por reflejo, y asi no hace falta un "volver" aparte. -->
  <header class="portada">
    <a href="/" aria-label="LON Philosophy — ir al inicio">
      <img src="/logo-catalogo.png" alt="LON" width="260" height="102">
    </a>
    <p data-i18n="c_portada">Philosophy · Carta</p>
    <p class="aviso-foto" id="avisoFoto" data-i18n="c_aviso_foto" hidden>Tocá un producto para ver su foto</p>
  </header>

  <!-- La carta se arma desde /carta-datos (hoja Carta; editor en Admin > Carta). -->
  <div id="carta"><p class="cargando" id="cargando">· · ·</p></div>
</main>
<footer data-i18n="c_precios">Precios en pesos argentinos.</footer>
<dialog class="foto" id="dlgFoto" aria-label="Foto del producto">
  <button type="button" id="dlgFotoX" aria-label="Cerrar foto" data-i18n-attr="aria-label:c_cerrar_foto">&times;</button>
  <img id="dlgFotoImg" alt="">
  <span class="nombre" id="dlgFotoNombre"></span>
</dialog>
<script src="/idioma.js"></script>
<script>
/* Carta armada desde los datos. Sin /carta-datos usa /carta-semilla.json (la carta
   original); los textos salen de nombre_<idioma> con caída al español. */
(function () {
  var cont = document.getElementById('carta');
  var dlg = document.getElementById('dlgFoto');
  var img = document.getElementById('dlgFotoImg');
  var nom = document.getElementById('dlgFotoNombre');
  var carta = null;

  var ICONO_SIN_TACC = '<svg class="sintacc" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" role="img"><title></title><path d="M12 21V9"/><path d="M12 9c-2-.5-3-2-3-4 2 .5 3 2 3 4zM12 9c2-.5 3-2 3-4-2 .5-3 2-3 4zM12 14c-2-.5-3-2-3-4 2 .5 3 2 3 4zM12 14c2-.5 3-2 3-4-2 .5-3 2-3 4z"/><path d="M4 20L20 4"/></svg>';

  function idioma() { return window.LONi18n ? window.LONi18n.idioma() : 'es'; }
  function nm(n) { return (n && (n[idioma()] || n.es)) || ''; }
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function nombre(it) {
    var s = el('span', 'nombre', nm(it.nombre));
    if (it.sin_tacc) {
      var t = window.LONi18n ? window.LONi18n.t('c_sin_tacc', 'Sin TACC') : 'Sin TACC';
      s.appendChild(document.createTextNode(' '));
      var holder = document.createElement('span');
      holder.innerHTML = ICONO_SIN_TACC;
      var svg = holder.firstChild;
      svg.setAttribute('aria-label', t);
      svg.querySelector('title').textContent = t;
      s.appendChild(svg);
    }
    return s;
  }

  function itemEl(it, c) {
    var e;
    if (c.formato === 'tres') {
      e = el('div', 'fila');
      e.appendChild(nombre(it));
      [it.precio_s, it.precio_m, it.precio_l].forEach(function (p) { e.appendChild(el('span', 'precio', p)); });
    } else if (c.estilo === 'puntos') {
      e = el('li');
      e.appendChild(nombre(it));
      e.appendChild(el('i'));
      e.appendChild(el('span', 'precio', it.precio));
    } else if (c.estilo === 'detalle') {
      e = el('div', 'item');
      var linea = el('div', 'linea');
      linea.appendChild(nombre(it));
      linea.appendChild(el('span', 'precio', it.precio));
      e.appendChild(linea);
      nm(it.descripcion).split('\n').forEach(function (l, i) {
        if (l.trim()) e.appendChild(el('span', i ? 'desc opc' : 'desc', l));
      });
    } else {
      e = el('div', 'fila uno');
      e.appendChild(nombre(it));
      e.appendChild(el('span', 'precio', it.precio));
    }
    e.setAttribute('data-foto', it.id);
    if (it.foto) {
      e.classList.add('con-foto');
      e.setAttribute('role', 'button');
      e.tabIndex = 0;
      e.addEventListener('click', function () { abrir(e, it.foto); });
      e.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrir(e, it.foto); }
      });
    }
    return e;
  }

  function cajaEl(c, s) {
    var box = el('section', c.marca ? 'caja marca' : 'caja');
    var titulo = nm(c.nombre);
    if (titulo) {
      var h = el('h3', null, titulo);
      h.id = 't-' + c.id;
      box.setAttribute('aria-labelledby', h.id);
      box.appendChild(h);
    } else {
      box.setAttribute('aria-label', nm(s.nombre));
    }
    if (c.formato === 'tres') {
      var enc = el('div', 'fila enc');
      enc.appendChild(el('span', null, ' '));
      c.rotulos.forEach(function (r) { enc.appendChild(el('span', null, r)); });
      box.appendChild(enc);
    } else if (c.rotulos[0]) {
      var enc1 = el('div', 'fila uno enc');
      enc1.appendChild(el('span', null, ' '));
      enc1.appendChild(el('span', null, c.rotulos[0]));
      box.appendChild(enc1);
    }
    function grupo(items) {
      if (c.formato !== 'tres' && c.estilo === 'puntos') {
        var ul = el('ul', 'puntos');
        items.forEach(function (it) { ul.appendChild(itemEl(it, c)); });
        box.appendChild(ul);
      } else {
        items.forEach(function (it) { box.appendChild(itemEl(it, c)); });
      }
    }
    var corrida = [];
    function volcar() { if (corrida.length) grupo(corrida); corrida = []; }
    c.hijos.forEach(function (h) {
      if (h.tipo === 'subgrupo') {
        volcar();
        box.appendChild(el('h4', null, nm(h.nombre)));
        grupo(h.items);
      } else corrida.push(h);
    });
    volcar();
    return box;
  }

  function pintar() {
    if (!carta) return;
    cont.textContent = '';
    var hayFoto = false;
    carta.secciones.forEach(function (s) {
      cont.appendChild(el('h2', 'seccion', nm(s.nombre)));
      s.categorias.forEach(function (c) {
        c.hijos.forEach(function (h) {
          (h.tipo === 'subgrupo' ? h.items : [h]).forEach(function (it) { if (it.foto) hayFoto = true; });
        });
        cont.appendChild(cajaEl(c, s));
      });
    });
    document.getElementById('avisoFoto').hidden = !hayFoto;
  }

  function abrir(e, url) {
    if (!dlg || !dlg.showModal) return;
    var n = e.querySelector('.nombre').cloneNode(true);
    n.querySelectorAll('svg').forEach(function (x) { x.remove(); });
    var texto = n.textContent.replace(/\s+/g, ' ').trim();
    img.src = url;
    img.alt = texto;
    nom.textContent = texto;
    document.body.classList.add('foto-abierta');
    dlg.showModal();
  }

  if (dlg) {
    document.getElementById('dlgFotoX').addEventListener('click', function () { dlg.close(); });
    // El click en el ::backdrop llega con el propio dialog como target.
    dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
    dlg.addEventListener('close', function () {
      document.body.classList.remove('foto-abierta');
      img.removeAttribute('src');
    });
  }

  function json(url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  json('/carta-datos').then(function (d) { return d.carta; })
    .catch(function () { return json('/carta-semilla.json'); })
    .then(function (d) { carta = d; pintar(); })
    .catch(function () { cont.textContent = ''; });

  window.addEventListener('lon-idioma', pintar);
})();
</script>
</body>
</html>
