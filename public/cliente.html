<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LON Philosophy - Escanear producto</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://unpkg.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#F6EFE4; --bg-alt:#EDE3D0; --ink:#3B1220; --ink-muted:#8C5B66;
    --line:rgba(59,18,32,0.18); --accent:#A9762A; --accent-soft:rgba(169,118,42,0.14);
    --stamp-green:#2F7D4F; --stamp-green-soft:rgba(47,125,79,0.14);
    --stamp-red:#B14A2E; --stamp-red-soft:rgba(177,74,46,0.14);
    --field-bg:#FFFFFF; --field-text:#3B1220; --radius:3px;
    --bg-header:#5E1E2B; --header-text:#FFF3E5; --header-line:rgba(0,0,0,0.22);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Archivo', -apple-system, sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--ink-muted);
  }

  .barra-superior-catalogo{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px;
    padding:14px 24px; background:var(--bg-header); border-bottom:1px solid var(--header-line);
  }
  .barra-superior-catalogo .volver{ justify-self:start; color:var(--header-text); }
  .logo-barra-catalogo{
    height:50px; width:auto; object-fit:contain; justify-self:center;
    filter:brightness(0) invert(1); opacity:.92;
  }
  .btn-volver-flecha{
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px; font-size:22px; background:none; border:none; cursor:pointer;
    text-decoration:none; padding:0;
    animation:volverFlechaFlotar 1.6s ease-in-out infinite;
  }
  .btn-volver-flecha:hover, .btn-volver-flecha:focus-visible{ animation-play-state:paused; transform:translateX(-4px); }
  @keyframes volverFlechaFlotar{
    0%, 100%{ transform:translateX(0); }
    50%{ transform:translateX(-5px); }
  }
  @media (prefers-reduced-motion: reduce){
    .btn-volver-flecha{ animation:none; }
  }

  #reader{ width:100%; max-width:480px; margin:20px auto 0; padding:0 24px; overflow:hidden; }
  #reader video{
    border-radius:var(--radius); border:1px solid var(--line);
    width:100% !important; height:auto !important; object-fit:cover;
  }

  .instruccion-escaneo{
    color:var(--ink); font-weight:700; text-align:center; font-size:15px;
    margin:14px 24px 0;
  }

  .status-bar{
    margin:16px 24px; padding:13px 16px; border-radius:var(--radius); background:var(--bg-alt);
    border:1px solid var(--line); font-size:13px; text-align:center; color:var(--ink-muted);
    font-family:'IBM Plex Mono', monospace; transition:background .2s, color .2s, border-color .2s;
  }
  .status-bar.ok{ background:var(--stamp-green-soft); border-color:var(--stamp-green); color:var(--stamp-green); }
  .status-bar.error{ background:var(--stamp-red-soft); border-color:var(--stamp-red); color:var(--stamp-red); }

  .log{ margin:44px 24px 44px; flex:1; overflow-y:auto; }
  .log h2{ font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--ink-muted); margin:0 0 10px; font-weight:400; }
  .log-item{
    display:flex; justify-content:space-between; align-items:center; padding:11px 0;
    border-bottom:1px solid var(--line); font-size:14px; gap:8px;
  }
  .log-item .sku-time-btn{
    display:block; text-align:left; background:none; border:none; padding:0; margin:0;
    font-family:'Archivo', sans-serif; font-size:14px; color:var(--ink); cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .badge{
    font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:500; letter-spacing:0.04em;
    padding:4px 8px; border-radius:var(--radius); white-space:nowrap; border:1px solid;
  }
  .badge.consulta{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }

  .overlay{
    position:fixed; inset:0; background:rgba(20,5,10,0.55);
    display:none; align-items:center; justify-content:center; z-index:1000; padding:20px;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--bg); border:1px solid var(--accent); border-radius:var(--radius);
    padding:28px 24px; max-width:340px; width:100%; text-align:center; position:relative;
    overflow:hidden;
  }
  .modal p.label{
    font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-muted);
    margin:0 0 6px; letter-spacing:0.1em; text-transform:uppercase;
  }
  .modal h2{
    font-family:'Fraunces', serif; font-weight:600; font-size:21px; margin:0 0 2px; line-height:1.2;
    color:var(--ink);
  }
  .modal .sku-chico{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-muted); margin:0 0 18px; }
  .modal .precio{ font-family:'Fraunces', serif; font-size:30px; font-weight:600; color:var(--accent); margin:0 0 22px; }
  .modal .precio.no-encontrado{ font-family:'Archivo', sans-serif; font-size:14px; font-weight:500; color:var(--stamp-red); }

  .stamp-in{ animation: stampDown 320ms cubic-bezier(.2,.9,.3,1.2); }
  @keyframes stampDown{
    0%{ transform:scale(1.5) rotate(-6deg); opacity:0; }
    60%{ transform:scale(0.97) rotate(1deg); opacity:1; }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }

  .modal-buttons{ display:flex; flex-direction:column; gap:10px; }
  .modal-buttons button{
    border:1px solid var(--ink); border-radius:var(--radius); padding:14px;
    font-family:'Archivo', sans-serif; font-size:15px; font-weight:600; cursor:pointer;
    background:transparent; color:var(--ink); transition:background .15s ease;
  }
  .btn-cerrar{ background:var(--ink); color:var(--bg); }
  .btn-ver-catalogo{ background:none; border:1px solid var(--accent); color:var(--accent); }

  @media (prefers-reduced-motion: reduce){ .stamp-in{ animation:none; } }

  .footer-legal{
    padding:14px 10px; padding-bottom:max(14px, env(safe-area-inset-bottom));
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:0.02em;
    color:var(--ink-muted); text-align:center; border-top:1px solid var(--line);
  }
  .footer-legal a{ color:var(--ink-muted); text-decoration:none; }

</style>
</head>
<body>

<div class="barra-superior-catalogo">
  <a class="volver btn-volver-flecha" href="/" title="Volver al catálogo" aria-label="Volver al catálogo">←</a>
  <a href="/admin.html" class="enlace-logo-header" title="Acceso admin" aria-label="Acceso admin" style="justify-self:center;">
    <img src="/logo-catalogo.png" alt="LON" class="logo-barra-catalogo">
  </a>
  <span></span>
</div>

<div id="reader"></div>
<p class="instruccion-escaneo">Apuntá la cámara al código QR del producto</p>
<div class="status-bar" id="statusBar">Esperando código QR...</div>

<div class="log">
  <h2>Últimos escaneados</h2>
  <div id="logList"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalCard">
    <p class="label">SKU escaneado</p>
    <h2 id="modalNombre">-</h2>
    <p class="sku-chico" id="modalSku">-</p>
    <p class="precio" id="modalPrecio">Buscando...</p>
    <div class="modal-buttons">
      <button class="btn-ver-catalogo" id="btnVerCatalogo">Ver en catálogo</button>
      <button class="btn-cerrar" id="btnCerrarCliente">Cerrar</button>
    </div>
  </div>
</div>

<div class="footer-legal">
  © 2026 FLN Data Analysis — Todos los derechos reservados · Software licenciado para uso exclusivo de LON Philosophy
  · <a href="/privacidad.html">Privacidad</a> · <a href="/terminos.html">Términos</a>
</div>

<script>
  /* Mismo criterio que en el catálogo público: el logo va al admin solo
     si hay una sesión de admin activa; si no, al catálogo. */
  (function fijarDestinoLogoHeader(){
    let destino = '/';
    try {
      const sesionAdmin = localStorage.getItem('admin_sesion');
      if (sesionAdmin && JSON.parse(sesionAdmin).token) destino = '/admin.html';
    } catch (e) {}
    document.querySelectorAll('.enlace-logo-header').forEach((a) => { a.href = destino; });
  })();

  const statusBar = document.getElementById('statusBar');
  const logList = document.getElementById('logList');
  const overlay = document.getElementById('overlay');
  const modalCard = document.getElementById('modalCard');
  const modalNombre = document.getElementById('modalNombre');
  const modalSku = document.getElementById('modalSku');
  const modalPrecio = document.getElementById('modalPrecio');
  const btnCerrarCliente = document.getElementById('btnCerrarCliente');

  let lastScanned = null;
  let lastScanTime = 0;
  let isBusy = false;
  let pendingSku = null;
  let pendingNombre = '';
  let modoSoloVista = false;

  function addLogEntry(sku, nombre, estado){
    // sku es el contenido crudo de lo que se escaneó (QR o código de
    // barras) — texto arbitrario, no confiable. Si no hay nombre de
    // producto (SKU no encontrado), NO puede ir por innerHTML: alguien
    // podría dejar un código impreso con HTML/JS como payload y
    // ejecutarlo en el navegador de quien lo escanee.
    const item = document.createElement('div');
    item.className = 'log-item';
    item.innerHTML = `
      <button type="button" class="sku-time-btn">
        <span></span>
      </button>
      <span class="badge consulta"></span>
    `;
    item.querySelector('.sku-time-btn span').textContent = nombre || sku;
    item.querySelector('.badge').textContent = estado;
    item.querySelector('.sku-time-btn').addEventListener('click', () => {
      lastScanned = null;
      isBusy = true;
      showModal(sku, { ocultarSku: true });
    });
    logList.prepend(item);
  }

  async function showModal(sku, opciones = {}){
    pendingSku = sku;
    pendingNombre = '';
    modoSoloVista = Boolean(opciones.ocultarSku);
    modalCard.classList.remove('stamp-in');
    modalSku.style.display = opciones.ocultarSku ? 'none' : 'block';
    modalSku.textContent = sku;
    modalNombre.textContent = 'Buscando...';
    modalPrecio.className = 'precio';
    modalPrecio.textContent = '';
    overlay.classList.add('show');

    try {
      const res = await fetch(`/producto/${encodeURIComponent(sku)}`);
      const data = await res.json();
      if (!res.ok) {
        modalNombre.textContent = 'No encontrado';
        modalPrecio.className = 'precio no-encontrado';
        modalPrecio.textContent = data.error || 'Producto no encontrado';
      } else {
        pendingNombre = data.nombre || '';
        modalNombre.textContent = data.nombre || '(sin nombre)';
        modalPrecio.className = 'precio';
        modalPrecio.textContent = `$${data.precio}`;
      }
      void modalCard.offsetWidth;
      modalCard.classList.add('stamp-in');
    } catch (err) {
      modalNombre.textContent = 'Error';
      modalPrecio.className = 'precio no-encontrado';
      modalPrecio.textContent = 'No se pudo consultar el producto';
      modalCard.classList.add('stamp-in');
    }
  }

  function hideModal(){
    overlay.classList.remove('show');
    pendingSku = null;
  }

  // Si la persona ya inició sesión con Google en el catálogo ("Mi
  // cuenta"), esa sesión queda guardada en localStorage (mismo origen,
  // se comparte con esta página) — usamos ese nombre/email para la
  // consulta en vez de pedírselo de nuevo acá.
  function getSesionClienteValida(){
    try {
      const crudo = localStorage.getItem('lon_cliente_sesion');
      if (!crudo) return null;
      const datos = JSON.parse(crudo);
      if (!datos || !datos.token || !datos.exp || Date.now() > datos.exp) return null;
      return datos;
    } catch (e) { return null; }
  }

  async function guardarConsultaCliente(sku){
    const sesion = getSesionClienteValida();
    try {
      await fetch('/consulta', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sku,
          nombre: sesion ? sesion.nombre : '',
          email: sesion ? sesion.email : '',
        })
      });
    } catch (err) {
      console.warn('No se pudo registrar la consulta:', err);
    }
  }

  function extraerSkuGeneral(skuCompleto){
    const partes = String(skuCompleto).split('-');
    if (partes.length <= 1) return skuCompleto;
    partes.pop();
    return partes.join('-');
  }

  document.getElementById('btnVerCatalogo').addEventListener('click', () => {
    const sku = pendingSku;
    if (!sku) return;
    const skuGeneral = extraerSkuGeneral(sku);
    window.location.href = `/?producto=${encodeURIComponent(skuGeneral)}`;
  });

  btnCerrarCliente.addEventListener('click', () => {
    const sku = pendingSku;
    const nombre = pendingNombre;
    const eraSoloVista = modoSoloVista;
    hideModal();
    isBusy = false;
    if (eraSoloVista) return; // solo estabamos reviendo una consulta pasada, no registramos nada de nuevo

    statusBar.className = 'status-bar';
    statusBar.textContent = `Consultado: ${nombre || sku}`;
    addLogEntry(sku, nombre, 'Consulta');
    guardarConsultaCliente(sku);
  });

  function handleScan(decodedText){
    const now = Date.now();
    if (isBusy || (decodedText === lastScanned && now - lastScanTime < 4000)) return;
    lastScanned = decodedText;
    lastScanTime = now;
    isBusy = true;
    showModal(decodedText);
  }

  let scanner = null;
  let escanerIniciado = false;

  /* Refuerza el enfoque continuo directo sobre la camara YA activa (no
     solo al pedirla en getUserMedia — en algunos celulares eso no
     alcanza). Si el navegador/dispositivo no lo soporta, no hace
     nada — nunca rompe el escaneo. */
  function reforzarEnfoqueContinuo(instanciaScanner){
    if (!instanciaScanner || typeof instanciaScanner.applyVideoConstraints !== 'function') return;
    try {
      instanciaScanner.applyVideoConstraints({ advanced: [{ focusMode: 'continuous' }] });
    } catch (e) {}
  }

  /* OJO: pedir resolucion/enfoque YA en el getUserMedia inicial (en vez
     de despues, con applyVideoConstraints sobre la camara ya andando)
     rompia el acceso a la camara en algunos Android/Chrome reales
     (confirmado: permisos bien, otras paginas con camara andan bien,
     solo esta pagina fallaba) — asi que el pedido inicial se deja
     minimo, IGUAL que antes de tocar nada de esto. El enfoque continuo
     se sigue reforzando, pero solo DESPUES de que la camara ya esta
     andando (eso nunca puede romper el acceso inicial). */
  function iniciarCamaraConFallback(instanciaScanner, configuracionEscaneo, onDecodificado){
    return instanciaScanner.start(
      { facingMode: 'environment' }, configuracionEscaneo, onDecodificado, () => {}
    ).then(() => { reforzarEnfoqueContinuo(instanciaScanner); });
  }

  function iniciarEscanerSiHaceFalta(){
    if (escanerIniciado) return;
    escanerIniciado = true;

    scanner = new Html5Qrcode('reader', {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODABAR,
        Html5QrcodeSupportedFormats.ITF,
      ]
    });
    iniciarCamaraConFallback(
      scanner,
      {
        fps: 10,
        qrbox: (viewfinderWidth, viewfinderHeight) => {
          const lado = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.5);
          return { width: lado, height: Math.floor(lado * 1.25) };
        }
      },
      (decodedText) => { handleScan(decodedText); }
    ).catch((err) => {
      statusBar.className = 'status-bar error';
      statusBar.textContent = 'No se pudo acceder a la cámara. Revisá los permisos del navegador.';
      escanerIniciado = false;
    });
  }

  /* Ultimo recurso manual: tocar el video vuelve a pedirle enfoque
     continuo a la camara. En Android/Chrome esto a veces "despierta" el
     autoenfoque cuando quedo trabado; en iOS/Safari no hace nada (esa
     plataforma no expone control de enfoque por navegador). */
  document.getElementById('reader').addEventListener('click', () => {
    if (scanner) reforzarEnfoqueContinuo(scanner);
  });

  function reiniciarEscaner(){
    if (scanner) {
      scanner.stop()
        .catch(() => {})
        .finally(() => {
          scanner = null;
          escanerIniciado = false;
          iniciarEscanerSiHaceFalta();
        });
    } else {
      escanerIniciado = false;
      iniciarEscanerSiHaceFalta();
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') reiniciarEscaner();
  });
  window.addEventListener('pageshow', (evento) => {
    if (evento.persisted) reiniciarEscaner();
  });

  iniciarEscanerSiHaceFalta();
</script>
</body>
</html>
