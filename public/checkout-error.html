<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No se pudo procesar el pago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6EFE4; --ink:#3B1220; --ink-muted:#8C5B66; --accent:#A9762A;
    --stamp-red:#B14A2E; --stamp-red-soft:rgba(177,74,46,0.14); --line:rgba(59,18,32,0.18); --radius:3px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:'Archivo', -apple-system, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:28px;
  }
  .icono{
    width:64px; height:64px; border-radius:50%; background:var(--stamp-red-soft); border:1px solid var(--stamp-red);
    display:flex; align-items:center; justify-content:center; font-size:28px; color:var(--stamp-red); margin-bottom:18px;
  }
  h1{ font-family:'Fraunces', serif; font-weight:600; font-size:26px; margin:0 0 8px; }
  p{ color:var(--ink-muted); font-size:15px; max-width:320px; margin:0 0 22px; line-height:1.5; }
  .pedido-id{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:8px 14px; margin-bottom:24px; }
  a.volver{
    background:var(--accent); color:#fff; text-decoration:none; padding:14px 28px; border-radius:var(--radius);
    font-weight:700; font-size:15px;
  }
</style>
</head>
<body>
  <div class="icono">✕</div>
  <h1>No pudimos procesar el pago</h1>
  <p>El pago fue rechazado o se canceló. No te preocupes, no se te cobró nada. Podés volver a intentarlo desde el catálogo.</p>
  <div class="pedido-id" id="pedidoId"></div>
  <a class="volver" href="/">Volver al catálogo</a>
  <script>
    const params = new URLSearchParams(window.location.search);
    const pedido = params.get('pedido');
    if (pedido) document.getElementById('pedidoId').textContent = 'Número de pedido: ' + pedido;
    else document.getElementById('pedidoId').style.display = 'none';
  </script>
</body>
</html>
