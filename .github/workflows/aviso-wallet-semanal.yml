# Render (plan actual) no tiene reloj propio: GitHub despierta el servicio y dispara el aviso.
# Secret requerido: AVISO_SEMANAL_TOKEN (el mismo valor que en Render). Variable opcional: LON_URL.
name: Aviso semanal de Wallet
on:
  schedule:
    - cron: '0 18 * * 3' # miércoles 18:00 UTC = 15:00 Argentina (GitHub puede demorar 10–30 min)
  workflow_dispatch:
jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar el aviso
        env:
          TOKEN: ${{ secrets.AVISO_SEMANAL_TOKEN }}
          URL: ${{ vars.LON_URL || 'https://lonphilosophy.com.ar' }}
        run: |
          # 120 s por intento (el servicio puede estar dormido); 409 = ya estaba corriendo el intento anterior.
          for i in 1 2 3; do
            code=$(curl -sS --max-time 120 -o salida.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" "$URL/tareas/aviso-semanal-wallet" || echo 000)
            cat salida.json 2>/dev/null; echo " -> HTTP $code"
            if [ "$code" = 200 ] || [ "$code" = 409 ]; then exit 0; fi
            sleep 20
          done
          exit 1
